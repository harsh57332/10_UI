# Central config. Every host, port, path, timeout, limit, model and GPU setting
# lives here. Nothing is hardcoded in the Agent, server, UI or model services.
# Override the file location with the G1UI_CONFIG environment variable.

robot:
  host: 192.168.0.120            # WiFi IP (the Agent listens here)
  ssh_user: unitree
  dds_interface: eth0            # internal robot network (192.168.123.x)
  app_dir: /home/unitree/g1ui/app
  conda_dir: /home/unitree/miniforge3
  conda_env: g1ui_robot
  deps_dir: /home/unitree/g1ui/deps
  urdf: assets/robot/g1_29dof_rev_1_0.urdf   # mode_machine 5, no hands
  mode_machine: 5

agent:
  port: 8100
  service_name: g1ui-agent
  request_timeout_s: 5.0         # server -> agent HTTP timeout
  retries: 3                     # server re-sends the same command id on network errors
  retry_gap_s: 0.5
  command_history: 500           # finished command ids remembered (no double execution)
  rpc_timeout_s: 3.0             # SDK RPC timeout (loco / audio)
  state_max_age_s: 0.05          # reuse a DDS sample this fresh instead of reading again

server:
  bind: 0.0.0.0
  port: 8000
  state_poll_ms: 250             # UI refresh period

discovery:
  subnet: 192.168.0.0/24
  timeout_s: 0.6

# FSM ids. "manipulation" is still to be verified on this robot (old robot: 501).
modes:
  ids:
    zero_torque: 0
    damping: 1
    squat: 2
    sit: 3
    stand_up: 4
    locomotion: 801
    manipulation: 501
  disabled: [squat, sit]         # "currently not in priority"
  # allowed next modes (any mode -> damping is always allowed)
  transitions:
    zero_torque: [damping]
    damping: [zero_torque, stand_up]
    stand_up: [locomotion, manipulation]
    locomotion: [manipulation]
    manipulation: [locomotion]
  switch_timeout_s: 6.0          # wait this long for the FSM read-back to match
  walk_modes: [locomotion, manipulation]
  arm_modes: [manipulation]

locomotion:
  speed_max: 0.6                 # m/s (forward/backward/aside)
  speed_default: 0.4
  ai_speed: 0.4                  # fixed speed in AI mode
  turn_speed_max: 0.6            # rad/s
  turn_speed_default: 0.4
  duration_max_s: 30.0
  turn_stop_lead_s: 0.25         # turn_by stops this early (x velocity) to absorb the stopping lag
  turn_settle_s: 0.6

arms:
  rate_hz: 50
  max_speed_dps: 45              # joint speed used to time set_upperbody moves
  playback_slowdown: 2.0         # planned trajectories play this many times slower (1.0 = as planned)
  playback_slowdown_holding: 3.0 # ...and this much slower while holding a box (gentle accelerations)
  max_arm_turn_deg: 300          # refuse a planned move whose joints of one arm turn more than this in
                                 # total: cuRobo accepts any collision-free IK, incl. arms wrapped over the
                                 # shoulders (that one was ~500-600; standing -> ready is ~180)
  waist_speed_dps: 20            # waist turns while manipulating
  waist_speed_holding_dps: 10    # ...and while holding a box (it fell during a 20 deg/s turn)
  engage_s: 1.0                  # arm_sdk weight ramp 0 -> 1
  release_s: 2.0                 # arm_sdk weight ramp 1 -> 0
  warn_motor_temp_c: 80          # any upper-body motor hotter than this while engaged -> state arms.warning;
                                 # the server then opens the hands and backs away (a release while gripping
                                 # dropped the arms around the box and knocked it over)
  max_motor_temp_c: 95           # last resort: arms released (the left wrist yaw reached 113 C holding a reach)
  resume_motor_temp_c: 75        # after that, engaging is refused until all are below this
  # kp / kd per joint index (12..28). Values from the previous G1, verify on this one.
  gains:
    waist: {kp: 300.0, kd: 3.0, joints: [12, 13, 14]}
    arm:   {kp: 150.0, kd: 4.0, joints: [15, 16, 17, 18, 22, 23, 24, 25]}   # 80 sagged 8 cm holding a box
    wrist: {kp: 60.0,  kd: 2.0, joints: [19, 20, 21, 26, 27, 28]}

audio:
  tts_speaker_id: 1              # 0 = Chinese, 1 = English (verify)
  tts_max_chars: 200
  file_max_mb: 10
  sample_rate: 16000
  chunk_bytes: 96000             # 3 s of 16 kHz mono int16
  chunk_gap_s: 1.0
  app_name: g1ui

headlight:
  default: "#FFFFFF"
  busy_color: "#FF0000"          # blinks while OWLv2 / cuRobo / LLM are processing
  blink_period_s: 0.5

end_effector:
  type: dummy                    # dummy | dex1 | dex3 | inspire

# Robot-side image server (D435i): RGB jpeg + aligned raw 16-bit depth (lossless PNG) over ZMQ PUB.
camera:
  service_name: g1ui-camera
  zmq_port: 5555
  control_port: 5556             # REQ/REP: {"preset": "fine" | "coarse"}
  presets:                       # D400 visual_preset per precision mode
    fine: 3                      # High Accuracy (manipulation)
    coarse: 1                    # Default (walking)
  width: 640
  height: 480
  fps: 20                        # sent rate (the D435i has no 20 fps mode, so capture runs faster)
  capture_fps: 30
  jpeg_quality: 85
  depth_png_level: 1             # 0..9, lossless either way; 1 = fastest
  frame_timeout_ms: 2000
  restart_gap_s: 10              # rapid restarts wedge the D435i

# Server-side image client.
image_client:
  stream_quality: 75             # MJPEG quality for the browser
  depth_view_max_m: 4.0          # depth colour map range (8-bit view only; raw depth stays 16-bit)
  stale_s: 1.5                   # no frame for this long -> camera shown as offline
  reconnect_s: 3.0               # no frame for this long -> subscribe again (after a robot reboot the old
                                 # connection is dead and ZMQ never notices)

ui:
  detect_text_max: 15
  nl_text_max: 500

# Server-side model services. Each speaks the same envelope on POST /infer (see common/envelope.py).
services:
  vision:
    host: 127.0.0.1
    port: 8030
    conda_env: g1ui_vision
    module: services.vision.app
    model: google/owlv2-large-patch14-ensemble
    device: cuda:0
    dtype: float32
    prompt: "a photo of a {}"     # OWLv2 text query template
    threshold: 0.15
    timeout_s: 30

  planner:
    host: 127.0.0.1
    port: 8040
    conda_env: g1ui_curobo
    module: services.planner.app
    robot_yml: assets/planner/g1_arms.yml        # built by scripts/build_planner_robot.py
    urdf: assets/planner/g1_arms.urdf
    tool_frames: [left_tcp, right_tcp]
    max_cuboids: 12
    interpolation_dt: 0.02                       # s between trajectory points sent to the robot
    ik_solutions: 32                             # IK solutions per pose goal; the nearest to the start is used
    ik_tries: 3                                  # ...or the next nearest if no path to it is found
    line:                                        # straight-line moves (contact moves: close in, squeeze, lift, lower, retreat)
      step_m: 0.01                               # IK every this far along the line, each nearest the previous
      step_deg: 3.0
      max_joint_step_deg: 12                     # a bigger jump between steps = an arm flip: refused
      seeds: 8                                   # IK seeds per step, all at the current angles (+ noise)
      seed_noise_deg: 2.0
      joint_speed_rps: 0.5                       # timing of the resulting trajectory (before playback slowdown)
    timeout_s: 60

  llm:
    host: 127.0.0.1
    port: 8025
    conda_env: g1ui_llm
    module: services.llm.serve                   # execs `vllm serve` with the flags below
    model: nvidia/Cosmos3-Nano
    served_name: cosmos3-nano
    hf_overrides: {architectures: [Cosmos3ReasonerForConditionalGeneration]}
    tensor_parallel_size: 1
    max_num_seqs: 256
    kv_cache_dtype: auto
    gpu_memory_utilization: 0.65                 # one GPU shared with OWLv2 and cuRobo
    max_model_len: 32768
    max_tokens: 4096
    temperature: 0.2
    timeout_s: 300
    env:                                         # FlashInfer's sampler JIT fails on sm_120 with the system nvcc
      VLLM_USE_FLASHINFER_SAMPLER: "0"

# Arms-only planning model: torso-rooted, waist fixed at 0, palm contact frames on the rubber hands.
planner_model:
  source_urdf: assets/robot/g1_29dof_rev_1_0.urdf
  source_meshes: third_party/unitree_ros/robots/g1_description/meshes
  # palm contact point in each rubber-hand frame (x along fingers, palms face each other at zero pose)
  # (bare rubber hand; `normal` points out of the palm toward the other hand)
  tcp:
    left_tcp:  {parent: left_rubber_hand,  xyz: [0.075, -0.030, 0.010], normal: [0, -1, 0]}
    right_tcp: {parent: right_rubber_hand, xyz: [0.075, 0.030, 0.010], normal: [0, 1, 0]}
  # padded work gloves over the rubber hands: the contact point moves out to the glove surface along
  # the palm normal, the hand collision spheres grow by the padding and the fingertips reach further
  glove:
    contact_m: 0.005             # innermost glove point (the curled fingertips) beyond the bare TCP, 3.5 cm
                                 # from the hand axis: two photo-checked reaches (gloves 9/3 cm short)
    fingertip_contact_x_m: 0.13  # ...that innermost point is this far along the hand (the fingertips)
    palm_twist_deg: 8            # the glove's contact line runs from the curled fingertips (3.5 cm out) to the
                                 # palm heel (~1.8 cm: 1.3 rubber + thin glove) over 13 cm. The contact frame
                                 # lies in it, so grasps twist the hand until heel and fingertips both touch
                                 # (square hands touched with the fingertips only: slips)
    pad_m: 0.025                 # padding thickness all round (grows the hand collision spheres; estimate)
    finger_extra_m: 0.02         # glove fingertips beyond the rubber fingertips (estimate)
  # extra self-collision ignores: the fitted upper-arm spheres overlap the torso by 1-2 cm even in the
  # robot's normal standing pose, which made every start state "in collision" (joint limits keep them apart)
  # and the two rubber hands: when squeezing, the box sits between them (soft rubber, slow squeeze)
  self_collision_ignore: {left_shoulder_roll_link: [torso_link, logo_link], right_shoulder_roll_link: [torso_link, logo_link],
                          left_shoulder_yaw_link: [torso_link, logo_link], right_shoulder_yaw_link: [torso_link, logo_link],
                          left_rubber_hand: [right_rubber_hand, right_wrist_yaw_link, right_wrist_pitch_link,
                                             right_wrist_roll_link],
                          right_rubber_hand: [left_rubber_hand, left_wrist_yaw_link, left_wrist_pitch_link,
                                              left_wrist_roll_link],
                          left_wrist_yaw_link: [right_wrist_yaw_link, right_wrist_pitch_link, right_wrist_roll_link],
                          left_wrist_pitch_link: [right_wrist_yaw_link, right_wrist_pitch_link, right_wrist_roll_link],
                          left_wrist_roll_link: [right_wrist_yaw_link, right_wrist_pitch_link, right_wrist_roll_link,
                                                 left_wrist_yaw_link],
                          right_wrist_roll_link: [right_wrist_yaw_link]}
  # (a wrist's roll and yaw segments: their fitted spheres touch once the wrist pitches ~30 deg, which made
  # every lift above ~6 cm "collide"; the real wrist pitches +-92 deg freely)
  # ...and the two wrists/hands: the squeeze command aims the gloves inside the object (the object stops
  # them), which in the model brings the wrist ends together; with an object between them they never touch
  fit_seed: 7                    # sphere fitting is random; a fixed seed keeps rebuilds identical
  held_object_spheres: 40        # sphere slots for a held box (planner avoids collisions with it)
  held_object_ignore: [left_rubber_hand, right_rubber_hand, left_wrist_yaw_link, right_wrist_yaw_link,
                       left_wrist_pitch_link, right_wrist_pitch_link, left_wrist_roll_link, right_wrist_roll_link,
                       left_elbow_link, right_elbow_link]

# Obstacle map from the head camera's depth (cuRobo Mapper -> distance field), built in the planner service
# from a frame taken before an arm skill: everything visible is an obstacle (any shape), the robot's own arms
# are removed (cuRobo RobotSegmenter) and the object being handled is cut out (it stays a fitted cuboid, so
# the squeeze can exclude it). The grid is in the torso frame at capture time.
scene_map:
  voxel_m: 0.01                  # surface (TSDF) voxel
  esdf_voxel_m: 0.015            # distance-field voxel the planner checks against
  center_m: [0.50, 0.0, 0.02]    # grid centre, torso frame (case top ~0.04, box tops ~0.19, hands ~0.28)
  extent_m: [0.90, 1.20, 0.84]   # multiples of esdf_voxel_m
  depth_max_m: 1.2
  robot_filter_m: 0.03           # depth this close to the robot's own collision spheres is the robot
  exclude_pad_m: 0.02            # the cut-out around the handled object is this much bigger than its cuboid

# Head camera mount. Depth is aligned to the RGB camera; points come out in its optical frame.
camera_mount:
  link: d435_link                # in the URDF, child of torso_link
  # optical frame (z forward, x right, y down) relative to the link (x forward, y left, z up)
  rgb_offset_m: [0.0, -0.015, 0.0]
  # torso-frame correction of measured points so they match the arms: the photo-checked reach found the
  # box 3 cm further left than the camera put it
  calib_offset_m: [0.0, 0.03, 0.0]

# Dual-arm box handling with dummy hands (squeeze between the palms). Torso frame, metres.
manipulation:
  # motor 15..28: hands at chest height, 24 cm to each side: clear of tables/boxes AND out of the
  # camera view (hands in front of the boxes spoiled their depth measurement)
  # left wrist yaw 4 deg: the gloved wrist rests there and cannot reach 0 (commanded 0 it pushed
  # constantly and heated to 113 C)
  ready_deg: [0, 35, 30, -45, 0, 0, 4, 0, -35, -30, -45, 0, 0, 0]
  grasp_pitch_deg: [0, 20, 40, 60, 75]   # fingers tilted down by these angles until a plan is found
  waist_deg: [0, 0, 0]
  max_face_deg: 45               # waist yaw limit when turning toward a target
  transit_margin_m: 0.025       # arm moves keep this far from every obstacle (map and cuboids); only the last
                                 # straight approach and the squeeze use 0 (model and tracking errors are ~1-2 cm)
  near_margin_m: 0.01            # moves that end close to a surface by design (coming down beside the object
                                 # to the grasp height, ~3.5 cm above its support) keep at least this
  approach_far_m: [0.06, 0.04, 0.03]   # gloves come down beside the object this far off its faces (the first
                                       # that fits between the neighbours), from above...
  approach_rise_m: [0.08, 0.05, 0.03]  # ...starting this much above the grasp height (first reachable): the move
                                       # there keeps transit_margin_m, only the short descent uses near_margin_m
  approach_clear_m: [0.02, 0.03]         # ...then move straight in to this far off the faces before the squeeze
                                         # (closest first; 1 cm is inside the planner's collision margin)
  squeeze_m: 0.02                # palms are commanded this far inside each face -> grip force (deeper
                                 # squeezes saturated the arm motors, so the lift only reached 4-6 cm)
  min_squeeze_gap_m: 0.02        # ...but never closer than this to each other
  lift_m: 0.10
  carry_clear_m: 0.025           # held box bottom at least this far above every other object
  place_above_m: 0.04            # approach the place pose from this far above
  pull_in_m: 0.08                # after lifting, draw the box this far toward the chest (less arm sag)
  min_carry_x_m: 0.30
  place_clear_m: 0.01            # box bottom this far above the surface when released
  max_object_size_m: 0.70        # detections bigger than this (any side) are surfaces, not objects
  min_box_width_m: 0.04
  max_box_width_m: 0.50
  grasp_min_above_support_m: 0.115   # palm point height above the support: the gloved hand reaches ~8 cm
                                     # below it (photo-checked); objects are grasped at their centre if higher
  table_block_m: 0.10            # table slab thickness below its top (arms may hang below the table edge)
  drop_gap_m: 0.012              # hands within this of their squeeze targets -> the box slipped
  lift_tolerance_m: 0.03         # measured hand height must reach the lift target within this
  lift_sag_comp_m: 0.03          # command the lift this much higher: the arms sag under a held box
  test_lift_m: 0.02              # grip test: raise this much and hold
  use_grasp_calibration: false   # closed-loop line-up over the target replaces it
  align_iters: 3                 # line up the measured palm midpoint over the target (place)
  align_tol_m: 0.005
  release_open_m: 0.01           # first open the palms to this far outside the box faces, slowly
  retreat_open_m: 0.03           # retreat: gloves open straight out this far before moving up and away
  release_lift_m: 0.04           # then lift the hands this much before opening fully
  test_hold_s: 0.6
  grip_preload_m: 0.02           # settled squeeze: each hand aimed this far past where the object stopped it
                                 # (sets the grip force; 2.5-3.8 cm overheated the shoulders in 30 s)
  grip_retries: 2                # test lift failed: squeeze grip_retry_step_m deeper and retry
  grip_retry_step_m: 0.005
  max_extra_squeeze_m: 0.02
  palm_align: [1.0, 0.5, 0.0]    # palm angle: 1 = flat on the measured faces (centred on them) ... 0 = along the
                                 # turned torso (a 22 deg waist turn put the palms 4.6 cm behind the box centre)
  max_trusted_box_yaw_deg: 15    # larger box-angle estimates are treated as mis-fits (run 8 gripped the length)
  face_fractions: [1.0, 0.5, 0.0]   # waist turn toward a target, as fractions of its angle (tried in order);
                                    # palms squeeze along the turned torso, the box turns to meet them

# AI control and skills.
ai:
  speed: 0.4                     # fixed walking speed (m/s); walk time = distance / speed
  table_standoff_m: 0.25         # torso origin to table front edge when ready to manipulate
  face_turn_deg: 15              # approach: turn toward a target more than this off to the side
  box_reach_x_m: 0.32            # box centre this far in front of the torso for a pick
  approach_tolerance_m: 0.05
  approach_max_leg_m: 1.5        # walk at most this far before looking again
  lateral_tolerance_m: 0.06
  max_replans: 2
  min_battery_pct: 20

# Depth-based measurement (calibrated on the Dex1-1 boxes: real 19 x 14 x 8 cm).
perception:
  fine_frames: 15                # manipulation: per-pixel median depth over this many frames
  fine_settle_s: 0.6             # wait after switching the camera preset
  box_edge_bias_m: 0.015         # added to box width/depth: dark box edges lose depth
  table_rim_m: 0.015             # raised rim/rails on a table or case top
  floor_below_m: -0.6            # points lower than this (pelvis frame) are floor, never a support
  look_edge_px: 6                # a detection this close to the top/bottom edge is cut off
  look_step_deg: 8               # waist pitch change per look adjustment
  look_max_pitch_deg: 20
  look_max_tries: 2

# Detect & track in the image client (server side).
tracking:
  depth_roi: 0.5                 # central fraction of a box used to measure its distance
  min_depth_px: 30               # fewer valid depth pixels than this -> distance unknown

logging:
  dir: logs
  level: INFO
